name: Release Plugin

on:
  push:
    tags: ['*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {on=1; next}
            on && $0 ~ "^## \\[" {on=0}
            on {print}
          ' CHANGELOG.md > notes.md || true
          test -s notes.md || echo "See [CHANGELOG](https://dvrch.github.io/mergdown2tex/) for details." > notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            main.js manifest.json