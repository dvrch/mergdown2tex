name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'example_vault/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Build the downloadable zips (vault exemple + plugin + bundle)
        run: node scripts/build_assets.js

      - name: Publish zips to the dedicated "bundle" release (unlimited bandwidth)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release non-versionnée (tag "bundle") qui sert les zips avec une bande
          # passante illimitée (assets de release GitHub). Le tag "bundle" ne matche
          # pas release.yml (limité aux tags versionnés), donc pas de double release.
          gh release view bundle --repo dvrch/mergdown2tex >/dev/null 2>&1 || \
            gh release create bundle --repo dvrch/mergdown2tex \
              --title "Téléchargements MergDown2TeX (bande passante illimitée)" \
              --notes "Zips téléchargeables : bundle plugin+vault, plugin, vault exemple, WASM compressés (un zip par moteur). Générés automatiquement par le CI." || true
          for f in docs/assets/mergdowntotex_bundle.zip docs/assets/mergdowntotex.zip docs/assets/full_manual_repport_exp.zip docs/assets/pandoc_wasm.zip docs/assets/typst_wasm.zip; do
            gh release upload bundle --repo dvrch/mergdown2tex "$f" --clobber || true
          done

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
